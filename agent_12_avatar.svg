<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Clip to keep the entire avatar perfectly contained within the 440px circle -->
    <clipPath id="avatar-clip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
    
    <!-- Smooth shadow for depth under the chin -->
    <linearGradient id="neck-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4966B" />
      <stop offset="100%" stop-color="#FCD3B4" />
    </linearGradient>

    <!-- Subtle gradient for the blazer to give it a premium finish -->
    <linearGradient id="blazer-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14314F" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
  </defs>

  <!-- Base Background Disc (Clean, solid, no patterns) -->
  <circle cx="256" cy="256" r="220" fill="#E2F0D9" />

  <!-- Character Bust Group (Clipped to the 440px circle) -->
  <g clip-path="url(#avatar-clip)">
    
    <!-- Back Hair / Hair Base -->
    <path d="M 160 250 C 160 140, 352 140, 352 250 L 360 310 L 152 310 Z" fill="#061626" />

    <!-- Neck -->
    <path d="M 224 300 L 224 380 L 288 380 L 288 300 Z" fill="#FCD3B4" />
    <!-- Neck Shadow -->
    <path d="M 224 316 C 224 350, 288 350, 288 316 L 288 380 L 224 380 Z" fill="url(#neck-shadow)" />

    <!-- White Inner Shirt -->
    <path d="M 210 370 L 256 442 L 302 370 L 330 476 L 182 476 Z" fill="#FFFFFF" />
    <!-- Shirt Shadow -->
    <path d="M 244 423 L 256 442 L 268 423 L 256 405 Z" fill="#E1E6EB" />

    <!-- Gold Tie (Accent Color) -->
    <path d="M 248 410 L 256 395 L 264 410 L 260 476 L 252 476 Z" fill="#FF9F43" />
    <!-- Tie Clip -->
    <rect x="250" y="422" width="12" height="3" fill="#FFFFFF" rx="1" />

    <!-- Blazer Torso -->
    <path d="M 110 476 C 110 405, 155 365, 215 365 L 297 365 C 357 365, 402 405, 402 476 Z" fill="url(#blazer-grad)" />

    <!-- Blazer Highlights & Structure Lines -->
    <path d="M 115 470 C 120 420, 158 380, 210 370" stroke="#1E3E62" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 397 470 C 392 420, 354 380, 302 370" stroke="#1E3E62" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Left Lapel -->
    <path d="M 215 365 L 256 438 L 244 476 L 175 476 Z" fill="#0F2B47" />
    <!-- Right Lapel -->
    <path d="M 297 365 L 256 438 L 268 476 L 337 476 Z" fill="#0F2B47" />

    <!-- Pocket Square (Gold Accent) -->
    <path d="M 315 422 L 330 410 L 340 422 Z" fill="#FF9F43" />
    <path d="M 310 425 L 345 425" stroke="#0A2540" stroke-width="3" stroke-linecap="round" />

    <!-- Head / Face Shape -->
    <path d="M 186 230 C 186 155, 326 155, 326 230 C 326 298, 290 335, 256 335 C 222 335, 186 298, 186 230 Z" fill="#FCD3B4" />

    <!-- Left Ear -->
    <circle cx="180" cy="245" r="15" fill="#FCD3B4" />
    <circle cx="182" cy="245" r="9" fill="#E5A982" />
    
    <!-- Right Ear -->
    <circle cx="332" cy="245" r="15" fill="#FCD3B4" />
    <circle cx="330" cy="245" r="9" fill="#E5A982" />

    <!-- Sleek Modern Hair (Front) -->
    <path d="M 172 225 C 172 125, 340 125, 340 205 C 340 235, 322 250, 312 225 C 302 195, 262 185, 232 205 C 202 225, 182 255, 172 225 Z" fill="#061626" />
    <!-- Hair Highlight -->
    <path d="M 210 148 C 240 138, 290 143, 320 168 C 300 158, 250 153, 210 173 Z" fill="#1D3B58" />

    <!-- Warm Friendly Blush -->
    <circle cx="204" cy="272" r="12" fill="#FF8A8A" opacity="0.2" />
    <circle cx="308" cy="272" r="12" fill="#FF8A8A" opacity="0.2" />

    <!-- Eyes (Focused & Intelligent) -->
    <ellipse cx="222" cy="236" rx="6" ry="8" fill="#0A2540" />
    <circle cx="220" cy="233" r="2" fill="#FFFFFF" />
    
    <ellipse cx="290" cy="236" rx="6" ry="8" fill="#0A2540" />
    <circle cx="288" cy="233" r="2" fill="#FFFFFF" />

    <!-- Eyebrows -->
    <path d="M 204 206 C 212 201, 228 203, 236 211" stroke="#061626" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 276 211 C 284 203, 300 201, 308 206" stroke="#061626" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Sharp Analyst Glasses (Deep Navy, Bold Frame) -->
    <!-- Left Frame -->
    <rect x="194" y="214" width="54" height="46" rx="15" fill="none" stroke="#0A2540" stroke-width="6" />
    <!-- Right Frame -->
    <rect x="264" y="214" width="54" height="46" rx="15" fill="none" stroke="#0A2540" stroke-width="6" />
    <!-- Bridge -->
    <path d="M 248 231 L 264 231" stroke="#0A2540" stroke-width="6" stroke-linecap="round" />
    <!-- Temples -->
    <path d="M 194 231 L 180 234" stroke="#0A2540" stroke-width="5" stroke-linecap="round" />
    <path d="M 318 231 L 332 234" stroke="#0A2540" stroke-width="5" stroke-linecap="round" />
    <!-- Lens Glare -->
    <path d="M 202 244 L 218 228" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M 272 244 L 288 228" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Nose (Minimal, Elegant) -->
    <path d="M 251 254 C 251 254, 256 270, 261 270" stroke="#D4966B" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Confident, Warm Smile -->
    <path d="M 236 294 C 242 305, 270 305, 276 294" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Subtle Lip Shadow -->
    <path d="M 250 308 C 253 310, 259 310, 262 308" stroke="#D4966B" stroke-width="2" stroke-linecap="round" fill="none" />

  </g>
</svg>
