<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Clip Path for 440px Diameter Circle (36px padding) -->
    <clipPath id="avatar-clip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>

    <!-- Premium Gradients -->
    <linearGradient id="skin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FFD8BE" />
    </linearGradient>

    <linearGradient id="hair-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="blazer-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Solid Background Disc -->
  <circle cx="256" cy="256" r="220" fill="#F8FAFC" />

  <!-- Character Group (Clipped to Circle) -->
  <g clip-path="url(#avatar-clip)">
    
    <!-- Torso / Back Layer of Clothing -->
    <path d="M 200 320 C 200 320, 200 476, 200 476 L 312 476 L 312 320 C 312 320, 256 340, 200 320 Z" fill="#1E293B" />
    
    <!-- Tech Accent / Zipper Line (ADR Drafter Precision Detail) -->
    <path d="M 256 330 L 256 476" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />

    <!-- Outer Tailored Blazer -->
    <!-- Left Shoulder & Lapel -->
    <path d="M 110 476 C 110 370, 175 335, 225 335 L 245 476 Z" fill="url(#blazer-grad)" />
    <path d="M 225 335 L 180 410 L 220 476 Z" fill="#334155" opacity="0.5" />
    
    <!-- Right Shoulder & Lapel -->
    <path d="M 402 476 C 402 370, 337 335, 287 335 L 267 476 Z" fill="url(#blazer-grad)" />
    <path d="M 287 335 L 332 410 L 292 476 Z" fill="#334155" opacity="0.5" />

    <!-- Blazer Highlights for 3D Vector Depth -->
    <path d="M 120 476 C 120 395, 170 350, 215 340" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 392 476 C 392 395, 342 350, 297 340" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Neck -->
    <path d="M 224 260 L 224 340 C 224 340, 256 362, 288 340 L 288 260 Z" fill="url(#skin-grad)" />
    <!-- Neck Shadow -->
    <path d="M 224 278 C 224 278, 256 308, 288 278 L 288 340 L 224 340 Z" fill="#E2A385" opacity="0.8" />

    <!-- Ears -->
    <!-- Left Ear (In Shadow) -->
    <path d="M 188 195 C 174 195, 174 225, 188 225 Z" fill="#E2A385" />
    <!-- Right Ear -->
    <path d="M 324 195 C 338 195, 338 225, 324 225 Z" fill="url(#skin-grad)" />

    <!-- Head / Face Shape -->
    <path d="M 188 190 C 188 135, 210 125, 256 125 C 302 125, 324 135, 324 190 C 324 245, 296 280, 256 280 C 216 280, 188 245, 188 190 Z" fill="url(#skin-grad)" />

    <!-- Face Shadow (Left Side for Depth) -->
    <path d="M 188 190 C 188 245, 216 280, 256 280 L 256 125 C 210 125, 188 135, 188 190 Z" fill="#E2A385" opacity="0.25" />

    <!-- Attentive, Sharp Eyes -->
    <!-- Left Eye -->
    <circle cx="218" cy="195" r="8" fill="#0F172A" />
    <circle cx="221" cy="192" r="2.5" fill="#FFFFFF" />
    <!-- Right Eye -->
    <circle cx="294" cy="195" r="8" fill="#0F172A" />
    <circle cx="297" cy="192" r="2.5" fill="#FFFFFF" />

    <!-- Eyelids / Sharp Brow Expression -->
    <path d="M 206 182 Q 218 176 230 182" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 282 182 Q 294 176 306 182" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Stylish, Professional Glasses (Architect Persona) -->
    <!-- Left Frame -->
    <circle cx="218" cy="195" r="25" stroke="#0F172A" stroke-width="4.5" fill="none" />
    <path d="M 200 180 L 212 173 L 205 208 L 193 215 Z" fill="#FFFFFF" opacity="0.12" /> <!-- Lens Glare -->
    <!-- Right Frame -->
    <circle cx="294" cy="195" r="25" stroke="#0F172A" stroke-width="4.5" fill="none" />
    <path d="M 276 180 L 288 173 L 281 208 L 269 215 Z" fill="#FFFFFF" opacity="0.12" /> <!-- Lens Glare -->
    <!-- Glasses Bridge & Temples -->
    <path d="M 243 195 Q 256 188 269 195" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 193 195 L 184 191" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 319 195 L 328 191" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Minimalist Nose with Drop Shadow -->
    <path d="M 252 208 L 252 228 C 252 232, 256 234, 260 232" stroke="#E2A385" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Warm, Confident Smile -->
    <path d="M 234 252 Q 256 268 278 252" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 248 263 Q 256 266 264 263" stroke="#E2A385" stroke-width="2" stroke-linecap="round" fill="none" /> <!-- Under-lip Shadow -->

    <!-- Friendly Cheek Blush -->
    <ellipse cx="202" cy="224" rx="10" ry="5" fill="#FCA5A5" opacity="0.35" />
    <ellipse cx="310" cy="224" rx="10" ry="5" fill="#FCA5A5" opacity="0.35" />

    <!-- Modern, Structured Hair (Undercut / Side-part) -->
    <!-- Back Hair Volume -->
    <path d="M 176 200 C 170 140, 200 95, 256 95 C 312 95, 342 140, 336 200 L 328 230 L 184 230 Z" fill="#0F172A" />
    
    <!-- Front Swooping Hair & Volume -->
    <path d="M 176 170 C 170 115, 210 80, 260 80 C 310 80, 342 105, 338 150 C 326 145, 312 140, 302 145 C 278 155, 268 125, 238 125 C 208 125, 188 145, 176 170 Z" fill="url(#hair-grad)" />
    
    <!-- Hair Highlights for Dimension -->
    <path d="M 218 92 C 248 87, 288 95, 314 120 C 304 115, 288 110, 274 115 C 248 123, 234 105, 218 92 Z" fill="#64748B" opacity="0.6" />

    <!-- Sleek Tech Earbud (Digital Specialist Detail) -->
    <circle cx="328" cy="212" r="5" fill="#94A3B8" />
    <circle cx="328" cy="212" r="2" fill="#38BDF8" /> <!-- Glowing Indicator Light -->

    <!-- Hexagonal Lapel Pin (Architect Symbolism) -->
    <polygon points="194,385 202,380 210,385 210,395 202,400 194,395" fill="url(#accent-grad)" />
    
  </g>
</svg>
