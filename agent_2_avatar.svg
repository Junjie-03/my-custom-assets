    <path d="M300,140 C315,155 322,175 322,195 C320,175 310,155 295,145 Z" fill="#1D3957" />
    <path d="M200,145 C185,160 178,180 178,200 C180,180 190,160 205,150 Z" fill="#1D3957" />

    <!-- Hair Shadow on Forehead -->
    <path d="M188,180 C188,180 210,170 256,170 C302,170 324,180 324,180 C324,180 310,192 256,192 C202,192 188,180 188,180 Z" fill="#E59F78" opacity="0.25" />

