    <path d="M233,253 C232,251 233,249 235,249" stroke="#0A2540" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M279,253 C280,251 279,249 277,249" stroke="#0A2540" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Eyes (Focused, Intelligent) -->
    <!-- Left Eye -->
    <ellipse cx="220" cy="200" rx="8" ry="5" fill="#FFFFFF" />
    <circle cx="220" cy="200" r="4" fill="#0A2540" />
    <circle cx="221.5" cy="198.5" r="1.5" fill="#FFFFFF" />
    <path d="M210,197 C215,193 225,193 230,197" stroke="#0A2540" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Right Eye -->
