    <!-- Inner Shirt Collar (White) -->
    <path d="M222,305 C222,350 290,350 290,305 Z" fill="#FFFFFF" />
    
    <!-- Modern Tie / Accent -->
    <path d="M251,330 L261,330 L265,420 L247,420 Z" fill="#20639B" />

