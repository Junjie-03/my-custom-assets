    <circle cx="292" cy="200" r="26" stroke="#0A2540" stroke-width="5" fill="none" />
    
    <!-- Bridge -->
    <path d="M246,198 C251,194 261,194 266,198" stroke="#0A2540" stroke-width="5" fill="none" stroke-linecap="round" />
    
    <!-- Temples -->
    <path d="M194,200 L182,196" stroke="#0A2540" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M318,200 L330,196" stroke="#0A2540" stroke-width="4" fill="none" stroke-linecap="round" />
    
    <!-- Glass Glare Reflection -->
    <path d="M205,185 L225,205" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25" />
    <path d="M277,185 L297,205" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25" />
    <path d="M200,185 C205,180 215,177 220,177" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M272,185 C277,180 287,177 292,177" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Front Hair / Framing Bob -->
    <path d="M178,180 C178,125 210,112 256,112 C302,112 334,125 334,180 C334,230 322,250 322,250 C315,220 310,180 280,165 C265,158 245,158 230,165 C200,180 195,220 188,250 C188,250 178,230 178,180 Z" fill="#0A2540" />

