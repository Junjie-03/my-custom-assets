    <path d="M278,183 C286,178 298,178 306,184" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Glasses (The Investigator Signature) -->
    <!-- Left Frame Shadow -->
    <circle cx="221" cy="202" r="26" stroke="#051220" stroke-width="5" fill="none" opacity="0.1" />
    <!-- Left Frame -->
    <circle cx="220" cy="200" r="26" stroke="#0A2540" stroke-width="5" fill="none" />
    
    <!-- Right Frame Shadow -->
    <circle cx="293" cy="202" r="26" stroke="#051220" stroke-width="5" fill="none" opacity="0.1" />
