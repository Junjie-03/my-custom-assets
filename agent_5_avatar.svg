<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for clipping and reusable assets -->
  <defs>
    <!-- Master 440px Circle Clip Path centered at (256, 256) with 36px padding -->
    <clipPath id="avatar-clip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>

  <!-- Main Character Group clipped to the 440px circle -->
  <g clip-path="url(#avatar-clip)">
    <!-- Solid Background Disc -->
    <circle cx="256" cy="256" r="220" fill="#F8FAFC" />

    <!-- Soft Ambient Shadow Behind the Character Bust -->
    <path d="M 110 460 C 110 380, 180 335, 256 335 C 332 335, 402 380, 402 460 L 402 520 L 110 520 Z" fill="#0F172A" opacity="0.06" transform="translate(0, 12)" />

    <!-- Back Hair (Base Layer) -->
    <path d="M 172 210 C 160 270, 180 310, 210 325 L 302 325 C 332 310, 352 270, 340 210 Z" fill="#0F172A" />

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 186 210 C 174 210, 174 235, 186 240 Z" fill="#FED7AA" />
    <path d="M 186 215 C 178 215, 178 230, 186 235 Z" fill="#FDBA74" />
    <!-- Right Ear -->
    <path d="M 326 210 C 338 210, 338 235, 326 240 Z" fill="#FED7AA" />
    <path d="M 326 215 C 334 215, 334 230, 326 235 Z" fill="#FDBA74" />

    <!-- Minimalist Gold Earrings (Warm Accent) -->
    <circle cx="178" cy="236" r="5" fill="#F59E0B" />
    <circle cx="334" cy="236" r="5" fill="#F59E0B" />

    <!-- Neck -->
    <path d="M 226 280 C 226 310, 236 340, 256 350 C 276 340, 286 310, 286 280 Z" fill="#FDBA74" />
    <!-- Neck Shadow under Chin -->
    <path d="M 226 280 C 240 300, 272 300, 286 280 C 270 290, 242 290, 226 280 Z" fill="#F97316" opacity="0.25" />

    <!-- Face Structure -->
    <path d="M 186 215 C 186 155, 326 155, 326 215 C 326 270, 296 295, 256 295 C 216 295, 186 270, 186 215 Z" fill="#FED7AA" />
    <!-- Face Shadow (Left Side Curve for Depth) -->
    <path d="M 186 215 C 186 175, 230 160, 256 160 C 230 180, 200 210, 196 250 C 194 270, 216 290, 256 295 C 216 295, 186 270, 186 215 Z" fill="#FDBA74" opacity="0.15" />

    <!-- Soft Blush Cheeks -->
    <circle cx="198" cy="242" r="10" fill="#F43F5E" opacity="0.12" />
    <circle cx="314" cy="242" r="10" fill="#F43F5E" opacity="0.12" />

    <!-- Eyes & Expression -->
    <!-- Left Eye (Friendly, Curved Lid) -->
    <path d="M 206 210 Q 220 200 234 210" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="220" cy="214" r="9" fill="#1E293B" />
    <circle cx="223" cy="211" r="3" fill="#FFFFFF" />

    <!-- Right Eye (Friendly, Curved Lid) -->
    <path d="M 278 210 Q 292 200 306 210" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="292" cy="214" r="9" fill="#1E293B" />
    <circle cx="295" cy="211" r="3" fill="#FFFFFF" />

    <!-- Sharp, Professional Eyebrows -->
    <path d="M 204 190 C 212 183, 226 185, 234 191" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 308 190 C 300 183, 286 185, 278 191" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Minimalist Sharp Nose -->
    <path d="M 252 232 Q 256 244 260 240" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Confident, Warm Smile -->
    <path d="M 236 260 Q 256 274 276 260" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 234 262 Q 235 258 238 260" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 278 262 Q 277 258 274 260" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Sharp, Attentive Accountant Glasses -->
    <!-- Left Frame -->
    <circle cx="220" cy="212" r="26" stroke="#1E293B" stroke-width="5" fill="none" />
    <circle cx="218" cy="210" r="26" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.4" />
    <!-- Right Frame -->
    <circle cx="292" cy="212" r="26" stroke="#1E293B" stroke-width="5" fill="none" />
    <circle cx="290" cy="210" r="26" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.4" />
    <!-- Bridge (Gold Accent) -->
    <path d="M 246 212 Q 256 205 266 212" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Temples -->
    <path d="M 194 212 L 184 208" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    <path d="M 318 212 L 328 208" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    <!-- Lens Glare (Premium Detail) -->
    <path d="M 202 200 L 222 220" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35" />
    <path d="M 210 196 L 226 212" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.25" />
    <path d="M 274 200 L 294 220" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35" />
    <path d="M 282 196 L 298 212" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.25" />

    <!-- Forehead Shadow Cast by Hair -->
    <path d="M 188 210 C 198 185, 222 170, 256 170 C 285 170, 310 180, 318 205 C 314 215, 290 200, 256 200 C 215 200, 192 215, 188 210 Z" fill="#F97316" opacity="0.15" />

    <!-- Front Hair (Modern Stylized Bob) -->
    <path d="M 172 200 C 165 130, 220 105, 256 105 C 305 105, 347 130, 340 210 C 335 255, 322 280, 322 280 C 322 280, 326 230, 318 205 C 310 180, 285 170, 256 170 C 222 170, 198 185, 188 210 C 182 225, 184 255, 184 255 C 184 255, 176 235, 172 200 Z" fill="#0F172A" />
    <!-- Sweeping Bangs Layer -->
    <path d="M 200 160 C 240 145, 290 160, 315 195 C 290 175, 240 170, 210 185 Z" fill="#1E293B" />
    <!-- Hair Highlights -->
    <path d="M 270 115 C 295 125, 325 150, 332 180 C 328 155, 305 130, 270 115 Z" fill="#475569" opacity="0.5" />
    <path d="M 230 115 C 205 125, 185 150, 178 180 C 182 155, 205 130, 230 115 Z" fill="#475569" opacity="0.3" />

    <!-- Clothing (Enterprise Insurance / Commission Accountant Persona) -->
    <!-- Sharp Slate Blue Blazer -->
    <path d="M 110 460 C 110 380, 180 335, 256 335 C 332 335, 402 380, 402 460 L 402 520 L 110 520 Z" fill="#1E293B" />

    <!-- Inner Shirt (Crisp Light Blue-Grey) -->
    <path d="M 216 330 L 256 410 L 296 330 Z" fill="#E2E8F0" />
    <!-- White Shirt Collar Wings -->
    <path d="M 216 330 L 236 365 L 256 365 Z" fill="#FFFFFF" />
    <path d="M 296 330 L 276 365 L 256 365 Z" fill="#FFFFFF" />

    <!-- Gold Tie (Symbolizes Wealth, Commissions, and Precision) -->
    <path d="M 249 363 L 263 363 L 259 375 L 253 375 Z" fill="#F59E0B" />
    <path d="M 253 375 L 259 375 L 264 430 L 256 442 L 248 430 Z" fill="#F59E0B" />
    <!-- Tie Shadow -->
    <path d="M 256 375 L 259 375 L 264 430 L 256 442 Z" fill="#D97706" />

    <!-- Blazer Lapels -->
    <path d="M 216 330 L 256 415 L 232 415 L 176 365 Z" fill="#334155" />
    <path d="M 296 330 L 256 415 L 280 415 L 336 365 Z" fill="#334155" />
    <!-- Lapel Shadow for Depth -->
    <path d="M 256 415 L 280 415 L 336 365 L 340 370 L 284 420 L 256 420 Z" fill="#0F172A" opacity="0.3" />

    <!-- Breast Pocket with Gold Accountant Pen (Attention to Detail) -->
    <path d="M 148 408 L 180 398 L 178 412 L 146 422 Z" fill="#0F172A" />
    <!-- Silver Pen Body -->
    <path d="M 156 392 L 162 390 L 160 405 L 154 407 Z" fill="#64748B" />
    <!-- Gold Pen Clip -->
    <path d="M 158 394 L 161 393 L 159 412 L 156 413 Z" fill="#F59E0B" />

    <!-- Subtle Shoulder Highlights for 3D Vector Polish -->
    <path d="M 112 458 C 115 410, 160 355, 210 342" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 400 458 C 397 410, 352 355, 302 342" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.2" />
  </g>
</svg>
