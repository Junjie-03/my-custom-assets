    <!-- Blazer Base (Deep Navy) -->
    <path d="M115,430 C115,355 168,325 256,325 C344,325 397,355 397,430 L410,485 L102,485 Z" fill="#0A2540" />
    <!-- Blazer Shadow (Left Side) -->
    <path d="M115,430 C115,355 168,325 256,325 L256,485 L102,485 Z" fill="#051424" opacity="0.2" />

    <!-- Inner Shirt (Crisp White) -->
    <path d="M212,325 L300,325 L256,405 Z" fill="#FFFFFF" />
    <!-- Inner Shirt Collar Lines -->
    <path d="M212,325 L232,365 L256,325 L280,365 L300,325" fill="none" stroke="#D0D9E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tie / Accent (Warm Terracotta - Advisor Theme) -->
    <path d="M247,345 L265,345 L269,415 L256,430 L243,415 Z" fill="#E07A5F" />
    <!-- Tie Shadow/Knot -->
    <path d="M245,340 L267,340 L263,356 L249,356 Z" fill="#C55F45" />

    <!-- Blazer Lapels -->
    <!-- Left Lapel -->
    <path d="M212,325 L250,395 L235,405 L175,355 Z" fill="#1C3D5A" />
    <path d="M212,325 L250,395 L244,395 L208,325 Z" fill="#0A2540" opacity="0.4" />
    <!-- Right Lapel -->
    <path d="M300,325 L262,395 L277,405 L337,355 Z" fill="#1C3D5A" />
    
