    <circle cx="219" cy="199" r="2.5" fill="#FFFFFF" />
    <path d="M208,202 C213,194 231,194 236,202" fill="none" stroke="#1D1B26" stroke-width="3" stroke-linecap="round" />
    
    <!-- Right Eye -->
    <ellipse cx="290" cy="202" rx="13" ry="7.5" fill="#FFFFFF" />
    <circle cx="290" cy="202" r="7" fill="#0A2540" />
    <circle cx="287" cy="199" r="2.5" fill="#FFFFFF" />
    <path d="M276,202 C281,194 299,194 304,202" fill="none" stroke="#1D1B26" stroke-width="3" stroke-linecap="round" />

